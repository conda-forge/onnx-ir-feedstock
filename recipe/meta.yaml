{% set version = "1.1.0" %}

package:
  name: onnx-ir
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/onnx-ir/onnx_ir-{{ version }}.tar.gz
  sha256: b72176de575d820ec26864d17270d58ef886a7cf64db7649d15fcc3d5ae2a8ee

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - onnx >=1.16
    - typing_extensions >=4.10
    - ml_dtypes >=0.5.0
    - sympy >=1.13

test:
  imports:
    - onnx_ir
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/onnx/ir-py
  summary: Efficient in-memory representation for ONNX
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmaarrfk
    - apmorton
